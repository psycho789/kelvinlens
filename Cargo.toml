[workspace]
resolver = "3"
members = ["crates/kelvinlens-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/psycho789/kelvinlens"
rust-version = "1.88"

[workspace.dependencies]
kelvinlens-core = { path = "crates/kelvinlens-core" }
libblackbody = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
